[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rffmmd"
version = "0.1.0"
description = "Two Random-Fourier-Feature MMD change point detectors: sparse dyadic grid and MOSUM."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ratchanon Petchprakob" }]
keywords = ["change point detection", "MMD", "random fourier features", "kernel methods"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
plot = ["matplotlib>=3.5"]
dev  = ["pytest>=7.0", "matplotlib>=3.5"]

[tool.setuptools.packages.find]
include = ["rffmmd*"]

[tool.pytest.ini_options]
# The test file is named test.py, which is not one of pytest's default
# discovery patterns (test_*.py / *_test.py), so name it explicitly.
python_files = ["test.py"]
